name: Build PS3 PKG
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar cache do toolchain
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: ps3dev
          key: ps3toolchain-v1

      - name: Configurar PATH do ps3dev
        run: |
          mkdir -p "$PS3DEV"
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Dependencias
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make texinfo \
            libncurses5-dev patch python3 subversion wget zlib1g-dev libtool libtool-bin \
            python-dev-is-python3 bzip2 libgmp3-dev pkg-config git

      - name: Compilar ps3toolchain (demora)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh

      - name: Salvar cache do toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ps3dev
          key: ps3toolchain-v1

      - name: Extrair zip do projeto
        run: unzip -q sm64coopdx-ps3.zip

      - name: Compilar teste de fumaca
        working-directory: sm64coopdx-ps3
        run: make -f Makefile.ps3 PS3_NETLOG_IP=192.168.0.10 smoke

      - name: Gerar PKG
        working-directory: sm64coopdx-ps3
        run: make -f Makefile.ps3 smoke.pkg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sm64coopdx-ps3-smoke
          path: |
            sm64coopdx-ps3/*.pkg
            sm64coopdx-ps3/*.self
            sm64coopdx-ps3/*.elf
          if-no-files-found: warn
